<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLAYTREE Servers</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{padding-top:90px}
    .wrap{max-width:960px;margin:0 auto;padding:40px 20px 80px;position:relative;z-index:1}
    .card{background:var(--bg2);border:1px solid var(--green4);border-radius:16px;padding:32px;margin-bottom:24px}
    h1{color:var(--green);font-size:2rem;margin-bottom:8px}
    h2{color:var(--green);margin-bottom:12px;font-size:1.2rem}
    p{color:var(--txt2);line-height:1.7}
    .server-list{display:flex;flex-direction:column;gap:12px;margin-top:16px}
    .server-item{display:flex;align-items:center;gap:16px;padding:16px;background:var(--bg);border:1px solid var(--bg4);border-radius:10px;transition:all .2s}
    .server-item:hover{border-color:var(--green3)}
    .server-status{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .server-status.online{background:var(--green);box-shadow:0 0 8px rgba(80,255,120,.5)}
    .server-status.offline{background:var(--red)}
    .server-info{flex:1}
    .server-name{color:var(--txt);font-weight:700;margin-bottom:2px}
    .server-detail{color:var(--txt3);font-size:.8rem}
    .server-players{color:var(--txt2);font-size:.85rem;min-width:80px;text-align:right}
    .btn-join{padding:8px 20px;background:linear-gradient(135deg,var(--green2),var(--green3));color:var(--bg);border:none;border-radius:6px;cursor:pointer;font-weight:700;font-size:.85rem;transition:all .2s}
    .btn-join:hover{transform:translateY(-2px)}
    .btn-host{width:100%;padding:14px;background:transparent;color:var(--green);border:1px solid var(--green3);border-radius:8px;cursor:pointer;font-weight:700;font-size:1rem;transition:all .2s;margin-top:16px}
    .btn-host:hover{background:var(--green4)}
    .muted{color:var(--txt3);font-size:.9rem}
  </style>
</head>
<body>
  <div id="particles-bg"></div>
  <nav id="navbar" style="position:fixed;top:0;left:0;right:0">
    <div class="nav-left"><a href="index.html" class="logo" style="text-decoration:none">PLAYTREE</a></div>
    <div class="nav-right"><a href="index.html" class="btn-outline btn-small">Back</a> <button class="btn-outline btn-small" data-login-btn>Sign In</button></div>
  </nav>
  <main class="wrap">
    <div class="card">
      <h1>Servers</h1>
      <p>Browse and join multiplayer servers. Host your own or join an existing one.</p>
      <button class="btn-host" id="hostBtn">+ Host New Server</button>
    </div>
    <div class="card">
      <h2>Available Servers</h2>
      <div class="server-list" id="serverList"></div>
    </div>
  </main>
  <script>
    const LOBBY = (window.PLAYTREE_LOBBY_URL || 'http://localhost:5001');
    let allServers = [];
    async function loadServers() {
      try {
        const res = await fetch(LOBBY + '/servers');
        allServers = await res.json();
        renderServers();
      } catch(e) {
        allServers = [
          { id: 'demo1', name: 'GoStudios Official #1', detail: 'Chapter 0 - Season 0 | PvP Enabled', players: 12, max_players: 32, online: true },
          { id: 'demo2', name: 'GoStudios Official #2', detail: 'Chapter 0 - Season 0 | PvE Only', players: 8, max_players: 32, online: true },
          { id: 'demo3', name: 'Community - Fast XP', detail: 'Custom rules | 2x XP | Friendly', players: 24, max_players: 32, online: true },
        ];
        renderServers();
      }
    }
    function renderServers() {
      const list = document.getElementById('serverList');
      list.innerHTML = allServers.map(function(s) {
        return '<div class="server-item">' +
          '<div class="server-status ' + (s.online ? 'online' : 'offline') + '"></div>' +
          '<div class="server-info"><div class="server-name">' + s.name + '</div><div class="server-detail">' + s.detail + '</div></div>' +
          '<div class="server-players">' + s.players + '/' + s.max_players + '</div>' +
          '<button class="btn-join" ' + (s.online && s.players < s.max_players ? '' : 'disabled') + ' onclick="joinServer(\'' + s.id + '\',\'' + s.name + '\')">Join</button>' +
        '</div>';
      }).join('');
    }
    async function joinServer(id, name) {
      const playerName = (typeof PTCurrentName === 'function' ? PTCurrentName() : 'Player');
      try {
        const res = await fetch(LOBBY + '/servers/' + id + '/join', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({player_name: playerName})
        });
        const data = await res.json();
        if (data.ok) { PTToast('Joined ' + name + ' (' + data.players + ' players)'); }
        else { PTToast('Join failed: ' + (data.error || 'unknown')); }
      } catch(e) { PTToast('Joined ' + name + ' (demo)'); }
      loadServers();
    }
    async function hostServer() {
      const name = prompt('Server name:');
      if (!name) return;
      const playerName = (typeof PTCurrentName === 'function' ? PTCurrentName() : 'Host');
      try {
        const res = await fetch(LOBBY + '/servers', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({name: name, host: playerName, max_players: 16})
        });
        const data = await res.json();
        if (data.id) { PTToast('Server hosted: ' + name); loadServers(); }
        else { PTToast('Host failed: ' + (data.error || 'unknown')); }
      } catch(e) { PTToast('Server hosted (demo): ' + name); }
    }
    document.getElementById('hostBtn').onclick = hostServer;
    loadServers();
    setInterval(loadServers, 10000);
  </script>
  <script>window.PLAYTREE_LOBBY_URL = (document.querySelector('meta[name="lobby-url"]') || {}).content || 'http://localhost:5001';</script>
  <script src="script.js"></script>
  <script src="shared.js"></script>
  <div style="text-align:center;padding:16px;border-top:1px solid rgba(85,239,120,.2);margin-top:30px"><a href="https://x.com/PlayTreeReal" target="_blank" rel="noopener" style="color:#55ef78;text-decoration:none;font-weight:700">X @PlayTreeReal</a> | <a href="https://www.youtube.com/@PlayTreeGame" target="_blank" rel="noopener" style="color:#55ef78;text-decoration:none">YouTube</a> | <a href="https://discord.gg/playtree" target="_blank" rel="noopener" style="color:#55ef78;text-decoration:none">Discord</a> | <a href="downloads/index.html" style="color:#e0c66a;text-decoration:none">Downloads (.exe / .apk)</a><p style="color:#7d9a80;font-size:.8rem;margin-top:8px">Awaken. Rebuild. Restore Balance. - GoConsole Game Studios / GoStudios</p></div>
</body>
</html>
