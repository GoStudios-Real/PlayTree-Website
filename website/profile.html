<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLAYTREE Profile</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{padding-top:90px}
    .wrap{max-width:900px;margin:0 auto;padding:40px 20px;position:relative;z-index:1}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    @media(max-width:700px){.grid{grid-template-columns:1fr}}
    .card{background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px}
    .profile-head{display:flex;align-items:center;gap:20px;margin-bottom:20px;flex-wrap:wrap}
    .avatar{width:88px;height:88px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:900;color:#07120a;box-shadow:0 0 24px rgba(85,239,120,.3);flex-shrink:0}
    .profile-info h1{color:var(--green);margin-bottom:4px;font-size:1.6rem}
    .profile-info p{color:var(--muted);font-size:.9rem}
    .badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.7rem;font-weight:700;margin-left:8px}
    .badge.online{background:rgba(85,239,120,.15);color:var(--green);border:1px solid rgba(85,239,120,.3)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
    .stat{text-align:center;background:var(--ink);border-radius:10px;padding:14px 8px}
    .stat-val{display:block;font-size:1.6rem;font-weight:900;color:var(--green)}
    .stat-label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
    h2{color:var(--green);margin-bottom:14px;font-size:1.2rem}
    .friend-item{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--ink);border-radius:10px;margin-bottom:8px}
    .friend-avatar{width:40px;height:40px;border-radius:50%;background:var(--green-2);display:flex;align-items:center;justify-content:center;font-weight:700;color:#07120a;flex-shrink:0}
    .friend-name{flex:1;color:var(--text);font-weight:600}
    .friend-status{font-size:.75rem;padding:2px 8px;border-radius:999px}
    .friend-status.online{background:rgba(85,239,120,.15);color:var(--green)}
    .friend-status.offline{background:rgba(154,175,160,.15);color:var(--muted)}
    .friend-remove{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:4px 8px;border-radius:6px}
    .friend-remove:hover{color:var(--red,#ff4060);background:rgba(255,64,96,.1)}
    .add-row{display:flex;gap:8px;margin-top:12px}
    .add-row input{flex:1;padding:10px 12px;background:var(--ink);border:1px solid var(--line);border-radius:6px;color:var(--text)}
    .vc-panel{background:var(--ink);border-radius:12px;padding:16px}
    .vc-controls{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
    .vc-btn{flex:1;padding:10px;background:var(--ink-2);border:1px solid var(--line);border-radius:8px;color:var(--text);cursor:pointer;font-size:.85rem;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
    .vc-btn.active{background:var(--green);color:#07120a;border-color:var(--green)}
    .vc-btn.muted{background:var(--red,#ff4060);color:#fff;border-color:var(--red,#ff4060)}
    .vc-participant{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;margin-bottom:6px;background:var(--ink-2)}
    .vc-avatar{width:32px;height:32px;border-radius:50%;background:#144524;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:var(--green)}
    .vc-name{flex:1;color:var(--text);font-size:.85rem}
    .vc-indicator{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(85,239,120,.5)}
    .vc-indicator.muted{background:var(--red,#ff4060)}
    .vc-volume{margin-top:12px}
    .vc-volume label{color:var(--muted);font-size:.8rem;display:block;margin-bottom:4px}
    .vc-volume input{width:100%;accent-color:var(--green)}
    .vc-status{text-align:center;padding:8px;border-radius:6px;margin-top:10px;font-size:.85rem;background:rgba(85,239,120,.1);color:var(--green)}
    .empty-state{text-align:center;padding:20px;color:var(--muted);font-size:.9rem}
    .nav-left{display:none}.nav-right{display:flex}
  </style>
</head>
<body>
  <div id="particles-bg"></div>
  <nav id="navbar" style="position:fixed;top:0;left:0;right:0" aria-label="Primary navigation">
    <a class="brand" href="index.html">PLAYTREE</a>
    <div class="nav-right"><a href="index.html" class="btn-outline btn-small">Back</a></div>
  </nav>
  <main class="wrap">
    <div class="card">
      <div class="profile-head">
        <div class="avatar" id="profile-avatar">P</div>
        <div class="profile-info">
          <h1 id="display-name">Player <span class="badge online">Online</span></h1>
          <p>GoStudios Account <span data-player-name></span></p>
        </div>
        <button class="btn-outline btn-small" data-login-btn style="margin-left:auto">Sign In / Out</button>
      </div>
      <div class="stats">
        <div class="stat"><span class="stat-val">0</span><span class="stat-label">Hours</span></div>
        <div class="stat"><span class="stat-val">0</span><span class="stat-label">Rounds</span></div>
        <div class="stat"><span class="stat-val">0</span><span class="stat-label">Bosses</span></div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>👥 Friends</h2>
        <div id="friendsList"><p class="empty-state">No friends added yet.</p></div>
        <div class="add-row">
          <input type="text" id="addFriendName" placeholder="Friend name">
          <button class="btn-primary btn-small" onclick="PTFriends.add()">Add</button>
        </div>
      </div>

      <div class="card">
        <h2>🎤 Voice Chat</h2>
        <div class="vc-panel">
          <div class="vc-controls">
            <button class="vc-btn active" id="micBtn" onclick="toggleMic()">🎤 Mic On</button>
            <button class="vc-btn" id="deafBtn" onclick="toggleDeaf()">🔊 Speaker On</button>
          </div>
          <div class="vc-participant">
            <div class="vc-avatar">P</div>
            <span class="vc-name" id="vc-you">You (Player)</span>
            <div class="vc-indicator" id="youIndicator"></div>
          </div>
          <div class="vc-status">● Ready to connect</div>
        </div>
      </div>
    </div>
  </main>
  <script>
    let micOn = true, deafOn = false;
    function toggleMic() {
      micOn = !micOn;
      const btn = document.getElementById('micBtn');
      btn.textContent = micOn ? '🎤 Mic On' : '🎤 Mic Muted';
      btn.className = 'vc-btn' + (micOn ? ' active' : ' muted');
      document.getElementById('youIndicator').className = 'vc-indicator' + (micOn ? '' : ' muted');
    }
    function toggleDeaf() {
      deafOn = !deafOn;
      const btn = document.getElementById('deafBtn');
      btn.textContent = deafOn ? '🔇 Speaker Off' : '🔊 Speaker On';
      btn.className = 'vc-btn' + (deafOn ? ' muted' : '');
    }
    document.addEventListener('DOMContentLoaded', () => {
      const apply = () => {
        const name = PTCurrentName();
        document.getElementById('display-name').innerHTML = name + ' <span class="badge online">Online</span>';
        document.getElementById('vc-you').textContent = 'You (' + name + ')';
        document.getElementById('profile-avatar').textContent = (name || 'P').charAt(0).toUpperCase();
      };
      apply();
      const orig = window.PTApplyProfile;
      window.PTApplyProfile = function () { orig && orig(); apply(); };
    });
  </script>
  <script src="script.js"></script>
  <script src="shared.js"></script>
  <div style="text-align:center;padding:16px;border-top:1px solid rgba(85,239,120,.2);margin-top:30px"><a href="https://x.com/PlayTreeReal" target="_blank" rel="noopener" style="color:#55ef78;text-decoration:none;font-weight:700">X @PlayTreeReal</a> | <a href="https://discord.com/users/1451398119110738147" target="_blank" rel="noopener" style="color:#55ef78;text-decoration:none">Discord</a> | <a href="downloads/index.html" style="color:#e0c66a;text-decoration:none">Downloads (.exe / .apk)</a><p style="color:#7d9a80;font-size:.8rem;margin-top:8px">Awaken. Rebuild. Restore Balance. - GoConsole Game Studios / GoStudios</p></div>
</body>
</html>
