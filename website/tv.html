<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLAYTREE TV</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#000;color:#ecf6ed;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh}
    #tv{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
    .bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(85,239,120,.12),transparent 60%),radial-gradient(ellipse at 20% 80%,rgba(53,200,90,.08),transparent 50%);z-index:0}
    .content{position:relative;z-index:1}
    .logo{font-size:clamp(4rem,10vw,9rem);font-weight:900;letter-spacing:.1em;color:#55ef78;text-shadow:0 0 60px rgba(85,239,120,.4);margin:0}
    .tag{font-size:clamp(1rem,2.5vw,2rem);color:#e0c66a;letter-spacing:.3em;text-transform:uppercase;margin-top:12px}
    .hint{margin-top:40px;font-size:1.1rem;color:#9aafa0}
    .progress{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);width:min(700px,80vw);height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
    .progress i{display:block;height:100%;width:0;background:#55ef78;transition:width .2s}
  </style>
</head>
<body>
  <div id="tv">
    <div class="bg"></div>
    <div class="content">
      <h1 class="logo">PLAYTREE</h1>
      <p class="tag">Awaken &middot; Rebuild &middot; Restore Balance</p>
      <p class="hint" id="hint">Loading PLAYTREE...</p>
    </div>
    <div class="progress"><i id="bar"></i></div>
  </div>
  <script>
    // TV mode: auto-load, no auth code required.
    const hint = document.getElementById('hint');
    const bar = document.getElementById('bar');
    let progress = 0;
    const timer = setInterval(() => {
      progress += 5;
      bar.style.width = progress + '%';
      if (progress >= 100) {
        clearInterval(timer);
        hint.textContent = 'PLAYTREE TV Ready';
        // Redirect to the game download / play page after load
        setTimeout(() => { window.location.href = 'index.html'; }, 1500);
      }
    }, 40);
  </script>
  <div style="text-align:center;padding:16px;border-top:1px solid rgba(85,239,120,.2);margin-top:30px"><a href="https://x.com/PlayTreeReal" target="_blank" rel="noopener" style="color:#55ef78;text-decoration:none;font-weight:700">X @PlayTreeReal</a> | <a href="https://discord.com/users/1451398119110738147" target="_blank" rel="noopener" style="color:#55ef78;text-decoration:none">Discord</a> | <a href="downloads/index.html" style="color:#e0c66a;text-decoration:none">Downloads (.exe / .apk)</a><p style="color:#7d9a80;font-size:.8rem;margin-top:8px">Awaken. Rebuild. Restore Balance. - GoConsole Game Studios / GoStudios</p></div>
</body>
</html>
