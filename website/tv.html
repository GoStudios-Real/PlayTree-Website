<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLAYTREE TV</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#000;color:#ecf6ed;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh}
    #tv{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
    .bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(85,239,120,.12),transparent 60%),radial-gradient(ellipse at 20% 80%,rgba(53,200,90,.08),transparent 50%);z-index:0}
    .content{position:relative;z-index:1}
    .logo{font-size:clamp(4rem,10vw,9rem);font-weight:900;letter-spacing:.1em;color:#55ef78;text-shadow:0 0 60px rgba(85,239,120,.4);margin:0}
    .tag{font-size:clamp(1rem,2.5vw,2rem);color:#e0c66a;letter-spacing:.3em;text-transform:uppercase;margin-top:12px}
    .hint{margin-top:40px;font-size:1.1rem;color:#9aafa0}
    .progress{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);width:min(700px,80vw);height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
    .progress i{display:block;height:100%;width:0;background:#55ef78;transition:width .2s}
    .code{margin-top:24px;font-family:monospace;font-size:1.6rem;color:#55ef78;letter-spacing:.2em}
    .hidden{display:none!important}
  </style>
</head>
<body>
  <div id="tv">
    <div class="bg"></div>
    <div class="content">
      <h1 class="logo">PLAYTREE</h1>
      <p class="tag">Awaken · Rebuild · Restore Balance</p>
      <p class="hint" id="hint">Press any button to start</p>
      <p class="code hidden" id="code"></p>
    </div>
    <div class="progress"><i id="bar"></i></div>
  </div>
  <script>
    // TV mode: listen for remote/key input and show a pairing code.
    const hint = document.getElementById('hint');
    const codeEl = document.getElementById('code');
    const bar = document.getElementById('bar');
    let progress = 0;
    const code = String(Math.floor(100000 + Math.random()*900000));
    document.addEventListener('keydown', () => activate());
    document.addEventListener('click', () => activate());
    let active = false;
    function activate() {
      if (active) return;
      active = true;
      hint.textContent = 'Connecting to PLAYTREE...';
      const timer = setInterval(() => {
        progress += 4;
        bar.style.width = progress + '%';
        if (progress >= 100) {
          clearInterval(timer);
          hint.textContent = 'Connected! Open playtree.game on your phone';
          codeEl.textContent = 'Code: ' + code;
          codeEl.classList.remove('hidden');
        }
      }, 60);
    }
  </script>
</body>
</html>
