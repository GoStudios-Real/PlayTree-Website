<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLAYTREE - Play in Browser</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body{padding-top:0;background:#000;overflow:hidden}
    #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
    #loader{position:fixed;inset:0;z-index:30;background:radial-gradient(ellipse at 50% 40%,#0a1f0f,#000 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s}
    #loader h1{color:#55ef78;font:900 clamp(3rem,9vw,7rem) monospace;letter-spacing:.1em;margin:0;text-shadow:0 0 50px rgba(85,239,120,.5)}
    #loader .tag{color:#e0c66a;font:700 1.1rem monospace;letter-spacing:.3em;margin-top:10px}
    #bar-wrap{width:min(460px,80vw);height:10px;background:rgba(85,239,120,.15);border-radius:6px;margin-top:36px;overflow:hidden}
    #bar{height:100%;width:0;background:#55ef78;transition:width .3s}
    #status{color:#9abfa0;font:.85rem monospace;margin-top:12px}
    #play-btn{margin-top:30px;padding:14px 46px;font:700 1.1rem monospace;color:#04120a;background:#55ef78;border:none;border-radius:10px;cursor:pointer;display:none;box-shadow:0 0 30px rgba(85,239,120,.4)}
    #play-btn:hover{background:#7dff9a}
    #frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:none}
    #topbar{position:fixed;top:0;left:0;right:0;height:46px;z-index:40;background:rgba(4,18,10,.9);display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#55ef78;font:700 .9rem monospace}
    #topbar a{color:#e0c66a;text-decoration:none}
  </style>
</head>
<body>
  <div id="topbar"><span>PLAYTREE — Web Edition</span><a href="index.html">✕ Exit</a></div>
  <div id="loader">
    <h1>PLAYTREE</h1>
    <div class="tag">AWAKEN . REBUILD . RESTORE BALANCE</div>
    <div id="bar-wrap"><div id="bar"></div></div>
    <div id="status">Loading game engine...</div>
    <button id="play-btn">▶ PLAY</button>
  </div>
  <iframe id="frame" title="PLAYTREE Web Game" allow="autoplay; fullscreen"></iframe>

  <script>
    const bar = document.getElementById('bar');
    const status = document.getElementById('status');
    const playBtn = document.getElementById('play-btn');
    const loader = document.getElementById('loader');
    const frame = document.getElementById('frame');
    const steps = [
      'Loading game engine...', 'Growing the PlayTree...', 'Loading worlds...',
      'Summoning creatures...', 'Preparing combat...', 'Ready!'
    ];
    let p = 0, i = 0;
    const timer = setInterval(() => {
      p += 4 + Math.random()*6;
      bar.style.width = Math.min(100,p) + '%';
      const s = Math.min(Math.floor(p/100*steps.length), steps.length-1);
      if (s !== i) { i = s; status.textContent = steps[s]; }
      if (p >= 100) {
        clearInterval(timer);
        status.textContent = 'Ready to play';
        playBtn.style.display = 'block';
      }
    }, 120);
    playBtn.addEventListener('click', () => {
      loader.style.opacity = '0';
      setTimeout(() => loader.style.display='none', 600);
      frame.style.display = 'block';
      frame.src = 'web/index.html';
      frame.focus();
    });
  </script>
</body>
</html>
